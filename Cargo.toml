[workspace]
resolver = "3"
members = ["crates/*"]
# Чужой код (снимок Zed) со своим Cargo.lock и стилем: подключается приложениями через [patch], проверяется отдельно.
exclude = [
    "crates/pets-gpui-windows",
    "crates/pets-gpui-base",
    "crates/pets-gpui-linux",
    "crates/pets-gpui-wgpu",
    "crates/pets-gpui-macos-platform",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "LicenseRef-Proprietary"
repository = "https://github.com/Dicobraz/pets"

[workspace.dependencies]
pets-i18n = { path = "crates/pets-i18n" }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "tracing-log", "ansi"] }
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9"
sys-locale = "0.3"
windows-sys = "0.61"
toml = "1.1"
futures = { version = "0.3", default-features = false, features = ["std"] }
# Версия как у приложений: одна сборка gpui на рабочую область потребителя.
gpui-kit = "=0.9.1"

# «Не падать»: вне тестов нет unwrap/expect/panic!; в тестах разрешены (clippy.toml).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Свои патчи платформ gpui — и здесь (pets-ui), как у приложений.
[patch.crates-io]
gpui-pre-windows = { path = "crates/pets-gpui-windows" }
gpui-pre-linux = { path = "crates/pets-gpui-linux" }
gpui-pre-wgpu = { path = "crates/pets-gpui-wgpu" }
gpui-pre-macos = { path = "crates/pets-gpui-macos-platform" }

# Гигиена диска (H-01): номера строк в стектрейсах, PDB в разы меньше; без символов у зависимостей.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
