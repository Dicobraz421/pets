[package]
name = "pets-shell"
description = "Жизненный цикл процесса приложения Pets: журнал, паники, фатальные ошибки, единственный экземпляр, реестр, учётные данные — без UI (Windows, macOS, Linux)"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["registry"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_EventLog",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS (Postman MAC-02): Связка ключей, LaunchServices (CFString), стандартный поток ошибок в файл.
# MAC-04: HTML буфера обмена (`NSPasteboard`), вход в систему (`SMAppService`), управляемые настройки
# (`CFPreferences`), память процесса (`proc_pid_rusage`).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
core-foundation = "0.10.1"
libc = "0.2.191"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFBase",
    "CFNumber",
    "CFPreferences",
    "CFPropertyList",
    "CFString",
] }

# Linux (SHELL-LIN-01): Secret Service по D-Bus (`zbus`, без своего рантайма у приложения), поток ошибок в файл (`libc`).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"
zbus = { version = "5.19", default-features = false, features = ["async-io"] }

[lints]
workspace = true
