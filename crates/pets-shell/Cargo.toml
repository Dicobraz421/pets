[package]
name = "pets-shell"
description = "Жизненный цикл процесса приложения Pets: журнал, паники, фатальные ошибки, единственный экземпляр, реестр, учётные данные — без UI (Windows, macOS)"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["registry"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_EventLog",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS (Postman MAC-02): Связка ключей, LaunchServices (CFString), стандартный поток ошибок в файл.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
core-foundation = "0.10.1"
libc = "0.2.191"

[lints]
workspace = true
