[package]
name = "pets-ui"
description = "Визуальный язык приложений Pets на gpui: темы и токены ролей, тосты и история уведомлений"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gpui-kit.workspace = true
pets-i18n.workspace = true
thiserror.workspace = true
tracing.workspace = true
toml.workspace = true
futures.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS (Postman MAC-04): светлая/тёмная, акцент и политика — CFPreferences и AppKit; слежение — распределённые
# уведомления.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSColor", "NSColorSpace", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFBase",
    "CFDictionary",
    "CFNotificationCenter",
    "CFNumber",
    "CFPreferences",
    "CFPropertyList",
    "CFRunLoop",
    "CFString",
] }

[lints]
workspace = true

# Пример `image_check` (картинки Windows-платформы gpui): снимок PrintWindow и PNG.
[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_Xps"] }
